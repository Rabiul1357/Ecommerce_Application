<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>

<title>E-Commerce Store</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>
<body>

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand" href="/"> E-Commerce Store </a>

			<div>

				<a class="btn btn-dark me-2" href="/admin">Admin</a>

				<div sec:authorize="isAuthenticated()" class="d-inline">

					<a class="btn btn-success me-2" href="/cart">Cart</a> <a
						class="btn btn-warning me-2" href="/orders">Orders</a>

					<form th:action="@{/logout}" method="post" class="d-inline">

						<button type="submit" class="btn btn-danger">Logout</button>

					</form>

				</div>

				<div sec:authorize="isAnonymous()" class="d-inline">

					<a class="btn btn-primary" href="/login"> Login </a>

				</div>

			</div>
	</nav>

	<div class="container mt-4">

		<form action="/search" method="get" class="d-flex mb-4">

			<input type="text" name="keyword" class="form-control me-2"
				placeholder="Search Products">

			<button type="submit" class="btn btn-primary">Search</button>

			<!--       <a href="/"
           class="btn btn-secondary ms-2">
            All Products
        </a> -->

		</form>

		<div class="row">

			<div class="col-md-4 mb-4" th:each="product : ${products}">

				<div class="card shadow h-100">

					<img th:if="${product.imageUrl != null}"
						th:src="${product.imageUrl}" class="card-img-top"
						style="height: 250px; object-fit: cover;">

					<div class="card-body">

						<h4 th:text="${product.name}"></h4>

						<h5>
							₹<span th:text="${product.price}"></span>
						</h5>

						<p th:if="${product.stock > 0}">
							Stock : <span th:text="${product.stock}"></span>
						</p>

						<p th:if="${product.stock == 0}">
							<span class="badge bg-danger"> Out Of Stock </span>
						</p>

						<!-- USER OR NOT LOGGED IN -->

						<div sec:authorize="!hasRole('ADMIN')">

							<form th:action="@{/cart/add/{id}(id=${product.id})}"
								method="post">

								<button th:if="${product.stock > 0}"
									class="btn btn-primary w-100">Add To Cart</button>

								<button th:if="${product.stock == 0}"
									class="btn btn-secondary w-100" disabled>Out Of Stock
								</button>

							</form>

						</div>

						<!-- ADMIN -->

						<div sec:authorize="hasRole('ADMIN')">

							<a href="/manage-products" class="btn btn-dark w-100"> Manage
								Product </a>

						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

</body>
</html>
