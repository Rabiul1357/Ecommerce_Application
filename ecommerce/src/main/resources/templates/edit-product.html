<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Edit Product</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>
<body>

	<div class="container mt-5">

		<div class="card shadow p-4">

			<h2 class="mb-4">Edit Product</h2>

			<form th:action="@{/update-product}" th:object="${product}"
				method="post">

				<input type="hidden" th:field="*{id}">

				<div class="mb-3">

					<label>Name</label> <input type="text" th:field="*{name}"
						class="form-control">

				</div>

				<div class="mb-3">

					<label>Price</label> <input type="number" th:field="*{price}"
						class="form-control">

				</div>

				<div class="mb-3">

					<label>Stock</label> <input type="number" th:field="*{stock}"
						class="form-control">

				</div>

				<div class="mb-3">

					<label>Image URL</label> <input type="text" th:field="*{imageUrl}"
						class="form-control">

				</div>

				<button class="btn btn-success">Update Product</button>

			</form>

		</div>

	</div>

</body>
</html>
