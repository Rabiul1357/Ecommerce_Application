<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Admin Dashboard</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>
<body>

	<div class="container mt-5">

		<h1 class="text-center mb-5">Admin Dashboard</h1>

		<div class="row">

			<div class="col-md-6">

				<div class="card shadow p-4">

					<h3>Total Products</h3>

					<h2 th:text="${totalProducts}"></h2>

				</div>

			</div>

			<div class="col-md-6">

				<div class="card shadow p-4">

					<h3>Total Orders</h3>

					<h2 th:text="${totalOrders}"></h2>

				</div>

			</div>

		</div>

		<br>

		<div class="row">

			<div class="col-md-3">

				<a href="/add-product" class="btn btn-primary w-100"> Add
					Product </a>

			</div>

			<div class="col-md-3">

				<a href="/admin/orders" class="btn btn-primary w-100"> View All
					Orders </a>

			</div>

			<div class="col-md-3">

				<a href="/" class="btn btn-primary w-100"> Customer Store </a>

			</div>

			<div class="col-md-3">

				<a href="/manage-products" class="btn btn-primary w-100"> Manage
					Products </a>

			</div>


		</div>

	</div>

</body>
</html>
