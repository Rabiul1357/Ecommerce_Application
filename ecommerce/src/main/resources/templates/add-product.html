<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add Product</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<div class="container mt-5">

		<div class="card shadow p-4">

			<h2 class="text-center mb-4">Add Product</h2>

			<form th:action="@{/save-product}" th:object="${product}"
				method="post">

				<div class="mb-3">

					<label class="form-label"> Product Name </label> <input type="text"
						th:field="*{name}" class="form-control" required>

				</div>

				<div class="mb-3">

					<label class="form-label"> Price </label> <input type="number"
						th:field="*{price}" class="form-control" required>

				</div>

				<div class="mb-3">

					<label class="form-label"> Stock </label> <input type="number"
						th:field="*{stock}" class="form-control" required>

				</div>

				<div class="mb-3">

					<label class="form-label"> Image URL </label> <input type="text"
						th:field="*{imageUrl}" class="form-control"
						placeholder="Paste image URL here">

				</div>

				<button type="submit" class="btn btn-success w-100">Add
					Product</button>

			</form>

			<br> <a href="/admin" class="btn btn-secondary"> Back To
				Admin Dashboard </a>

		</div>

	</div>

</body>
</html>
